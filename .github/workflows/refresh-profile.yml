name: Refresh GitHub profile

on:
  push:
    paths:
      - .profile/**
      - .github/workflows/refresh-profile.yml
  schedule:
    - cron: '37 18 * * *' # 02:37 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .profile/package-lock.json
      - name: Install locked renderer dependencies
        run: npm ci --prefix .profile --ignore-scripts --no-audit --no-fund
      - name: Refresh public profile data and SVG assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .profile/refresh-profile.mjs
      - name: Save only changed profile files
        run: |
          git add -- README.md assets .profile/data-cache.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh profile data'
          git push origin "HEAD:${GITHUB_REF_NAME}"
