<svg xmlns="http://www.w3.org/2000/svg" width="900" height="140" viewBox="0 0 900 140" role="img" aria-labelledby="t d">
<title id="t">GitHub stats</title><desc id="d">Public repositories: 12, GitHub. Stars earned: 8, Public repositories. Contributions: 98, Past year. Current streak: 2, Best 6 days · past year</desc>
<defs>
  <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#0e1520"/><stop offset="1" stop-color="#131f2d"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffc685" stop-opacity=".18"/><stop offset="1" stop-color="#ffc685" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="900" height="140" rx="10"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Arial,sans-serif}.mono{font-family:Consolas,'SFMono-Regular',monospace}.in{animation:appear .6s both cubic-bezier(.2,.75,.3,1);animation-delay:var(--d,0s)}
.grow{transform-origin:left center;transform-box:fill-box;animation:grow .85s both cubic-bezier(.17,.75,.31,1);animation-delay:var(--d,0s)}
.draw{stroke-dasharray:100;stroke-dashoffset:0;animation:draw 1.55s both cubic-bezier(.3,.7,.35,1)}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(.02);opacity:.55}to{transform:none;opacity:1}}@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
